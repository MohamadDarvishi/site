      document.getElementById("header").innerHTML = data;
    });

	function toggleDropdown() {
			var dropdown = document.getElementById("dropdown");
			if (dropdown.style.display === "block") {
				dropdown.style.display = "none";
			} else {
				dropdown.style.display = "block";
			}
		}
	
		window.onclick = function(event) {
			if (!event.target.closest('.dropdown-btn')) {
				var dropdowns = document.getElementsByClassName("dropdown-content");
				for (var i = 0; i < dropdowns.length; i++) {
					var openDropdown = dropdowns[i];
					if (openDropdown.style.display === "block") {
						openDropdown.style.display = "none";
					}
				}
			}
		}
</script>

<script>
  // هنگام بارگیری صفحه
document.addEventListener('DOMContentLoaded', function() {
  const elements = document.querySelectorAll('*'); // انتخاب تمام عناصر
  elements.forEach(element => {
    element.classList.add('fade');
  });
});

// هنگام بسته شدن صفحه (مثلاً با کلیک بر روی یک دکمه)
document.getElementById('closeButton').addEventListener('click', function() {
  const elements = document.querySelectorAll('*'); // انتخاب تمام عناصر
  elements.forEach(element => {
    element.classList.add('fadeOut'); // کلاس fadeOut را برای افکت محو ایجاد کنید
  });
  // بعد از افکت محو، صفحه را ببندید
  setTimeout(function() {
    window.close(); // یا هر عمل دیگری برای بسته شدن صفحه
  }, 1000); // بعد از 1 ثانیه
});
// هنگام بارگیری صفحه
$(document).ready(function() {
  $('*').hide().fadeIn(1000); // تمام عناصر را پنهان کنید و سپس با افکت محو نمایش دهید
});

// هنگام بسته شدن صفحه
$('#closeButton').click(function() {
  $('*').fadeOut(1000, function() {
    // بعد از افکت محو، صفحه را ببندید
    window.close(); // یا هر عمل دیگری برای بسته شدن صفحه
  });
});


</script>
